name: CI

on:
  push:
    branches: [main, "claude/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  server:
    name: Server (Go) — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go toolchain of go.mod (security fixes)
        run: |
          want="$(awk '/^toolchain/ { print $2 }' go.mod)"
          go version
          [ "$(go env GOVERSION)" = "$want" ]
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: shellcheck
        working-directory: .
        run: shellcheck scripts/*.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Cross-compile for the Mac mini (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/thevault-server" ./cmd/thevault-server

  server-linux-arm64:
    name: Server (Go) — Linux ARM64 (Jetson)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race -count=1 ./...
      - name: Systemd user service — install (upgrade), status, restart after a crash, uninstall
        run: |
          CGO_ENABLED=0 go build -ldflags "-X main.version=ci" -o "$RUNNER_TEMP/thevault-server" ./cmd/thevault-server
          bin="$RUNNER_TEMP/thevault-server"
          # As on the Jetson: the user's services run without a login session (linger).
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          data="$HOME/.thevault-server"
          mkdir -p "$data"
          secret="$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          printf '{"listen":"127.0.0.1:8743","allowedEmails":["me@example.com"],"serverSecret":"%s","mailMode":"log"}\n' \
            "$secret" >"$data/config.json"
          healthy() {
            for _ in $(seq 60); do curl -fsS http://127.0.0.1:8743/v1/health && return 0; sleep 0.5; done
            cat "$data/server.log"
            return 1
          }
          "$bin" upgrade
          systemctl --user is-active thevault-server.service
          healthy
          "$bin" status | tee "$RUNNER_TEMP/status.txt"
          grep -q "Avvio automatico: ✓" "$RUNNER_TEMP/status.txt"
          # New terminals find the command (a link in ~/.local/bin, and that folder in the PATH of new shells).
          [ "$(readlink "$HOME/.local/bin/thevault-server")" = "$data/bin/thevault-server" ]
          bash -ic 'command -v thevault-server' | grep -q "$HOME/.local/bin/thevault-server"
          # Killed, it comes back by itself (Restart=always).
          pid="$(systemctl --user show -p MainPID --value thevault-server.service)"
          systemctl --user kill --signal=KILL thevault-server.service
          sleep 1
          healthy
          [ "$(systemctl --user show -p MainPID --value thevault-server.service)" != "$pid" ]
          "$bin" uninstall
          if systemctl --user is-active thevault-server.service; then exit 1; fi

  app-test:
    name: App (Flutter) — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  app-build:
    name: App — build ${{ matrix.os }}
    needs: app-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --debug
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --debug
